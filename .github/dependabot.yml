# Atualizações semanais de dependências. As mensagens seguem Conventional Commits
# (build(deps): ..., ci(deps): ...) para passar no commitlint e entrar no CHANGELOG.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: build
      include: scope
    groups:
      # Junta atualizações pequenas num PR só, para não lotar a caixa de PRs.
      python-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: ci
      include: scope
    groups:
      pre-commit-hooks:
        patterns: ["*"]
